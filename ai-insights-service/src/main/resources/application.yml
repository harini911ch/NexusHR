server:
  port: 8086

spring:
  application:
    name: ai-insights-service
  ai:
    model:
      chat: ${SPRING_AI_CHAT_MODEL:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    retry:
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.1
          max-tokens: 256
app:
  jwt:
    secret: ${JWT_SECRET}
  ai:
    provider: ${APP_AI_PROVIDER:deterministic}
    connect-timeout: ${AI_PROVIDER_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${AI_PROVIDER_READ_TIMEOUT:PT15S}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never