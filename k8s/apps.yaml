              valueFrom:
                configMapKeyRef:
                  name: nexushr-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexushr-config
                  key: SMTP_PORT
            - name: SMTP_AUTH
              valueFrom:
                configMapKeyRef:
                  name: nexushr-config
