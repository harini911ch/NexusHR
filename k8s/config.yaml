apiVersion: v1
kind: ConfigMap
metadata:
  name: nexushr-config
  namespace: nexushr
data:
  POSTGRES_DB: nexushr
  COOKIE_SECURE: "true"
  APP_ALLOWED_ORIGINS: https://nexushr.example.com
  WEBSOCKET_ALLOWED_ORIGINS: https://nexushr.example.com
  EMAIL_ENABLED: "false"
  PASSWORD_RESET_EMAIL_ENABLED: "false"
  PASSWORD_RESET_TOKEN_TTL_MINUTES: "30"
  FRONTEND_BASE_URL: https://nexushr.example.com
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_AUTH: "true"
  SMTP_STARTTLS: "true"
  SMTP_STARTTLS_REQUIRED: "true"
  SMTP_FROM: noreply@nexushr.example.com
  SMTP_CONNECTION_TIMEOUT_MS: "5000"
  SMTP_READ_TIMEOUT_MS: "10000"
  SMTP_WRITE_TIMEOUT_MS: "5000"
  NOTIFICATION_OUTBOX_POLL_INTERVAL_MS: "1000"
  NOTIFICATION_OUTBOX_BATCH_SIZE: "20"
  NOTIFICATION_OUTBOX_MAX_ATTEMPTS: "12"
  NOTIFICATION_OUTBOX_LEASE_SECONDS: "30"
  NOTIFICATION_DELIVERY_POLL_INTERVAL_MS: "2000"
  NOTIFICATION_DELIVERY_BATCH_SIZE: "20"
  NOTIFICATION_DELIVERY_MAX_ATTEMPTS: "12"
  NOTIFICATION_DELIVERY_LEASE_SECONDS: "60"
  DOCUMENT_STORAGE_TYPE: s3
  DOCUMENTS_S3_BUCKET: nexushr-employee-documents
  AWS_REGION: us-east-1
  DOCUMENTS_S3_ENDPOINT: ""
  DOCUMENTS_S3_PATH_STYLE_ACCESS: "false"
  ATTENDANCE_ZONE: UTC
  ATTENDANCE_WORKDAY_START: "09:00"
  STANDARD_DAILY_MINUTES: "480"
  APP_AI_PROVIDER: deterministic
  SPRING_AI_CHAT_MODEL: none
  OPENAI_MODEL: gpt-4o-mini
  SPRING_AI_OPENAI_BASE_URL: https://api.openai.com
  AI_PROVIDER_CONNECT_TIMEOUT: PT3S
  AI_PROVIDER_READ_TIMEOUT: PT15S
  AUTH_DB_URL: jdbc:postgresql://postgres:5432/nexushr?currentSchema=auth_data
  EMPLOYEE_DB_URL: jdbc:postgresql://postgres:5432/nexushr?currentSchema=employee_data
  PAYROLL_DB_URL: jdbc:postgresql://postgres:5432/nexushr?currentSchema=payroll_data
  ATTENDANCE_DB_URL: jdbc:postgresql://postgres:5432/nexushr?currentSchema=attendance_data
  PERFORMANCE_DB_URL: jdbc:postgresql://postgres:5432/nexushr?currentSchema=performance_data
  NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/nexushr?currentSchema=notification_data
