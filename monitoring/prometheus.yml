global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8090"]
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]
  - job_name: employee-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["employee-service:8082"]
  - job_name: payroll-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payroll-service:8083"]
  - job_name: attendance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["attendance-service:8084"]
  - job_name: performance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["performance-service:8085"]
  - job_name: ai-insights-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ai-insights-service:8086"]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8087"]
