server:
  port: 8085

spring:
  application:
    name: performance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/nexushr_auth?currentSchema=performance_data}
    username: ${DB_USERNAME:nexushr}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    default-schema: performance_data
    schemas: performance_data
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
